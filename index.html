<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Manager Pro</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1b2e">
<style>
:root{--bg:#f2f5f3;--cd:#fff;--tx:#10202e;--mu:#5a6a78;--ac:#0b8a4a;--wa:#a85f00;--bd:#d6dfe0}
:root[data-t=dark]{--bg:#0b1b2e;--cd:#132a42;--tx:#e8eef4;--mu:#92a5b6;--ac:#3ddc84;--wa:#ffb74d;--bd:#26435f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto;padding:8px 10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 10px;max-width:720px;margin:auto}
header h1{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block}.dot.off{background:var(--wa)}
.dn{display:flex;gap:6px}.dn input{flex:1;min-width:0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px}
button{cursor:pointer;font-weight:600}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.hid{display:none!important}.mu{color:var(--mu)}small{color:var(--mu)}
#q{width:100%;font-size:18px;padding:14px}
.qr{display:flex;gap:6px;margin:6px 0}.qr button{flex:1}
#pv{min-height:20px;font-size:13px;color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.c b{display:block;font-size:17px}
.c.g1 b{color:var(--ac)}.c.w b{color:var(--wa)}
.r{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:5px 0}
.r.unverified{border-left:4px solid var(--wa)}.r.cancelled{opacity:.5;text-decoration:line-through}
.bd{font-size:12px;color:var(--mu);margin-top:3px}.bd i{font-style:normal;color:var(--wa)}
h2{font-size:15px;margin:12px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:52px}nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
dialog{width:min(560px,94vw);background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px}
dialog::backdrop{background:#0008}
.fm{display:grid;gap:6px}.fm label{display:grid;gap:2px;font-size:12px;color:var(--mu)}.f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#rt{width:100%;height:46vh;font:13px/1.35 ui-monospace,monospace}
#toast{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#10202e;color:#fff;padding:10px 12px;border-radius:10px;z-index:9;display:flex;justify-content:space-between;gap:8px}
#toast button{min-height:30px;padding:2px 10px}
#pr{display:none}
@media print{body>*{display:none!important}#pr{display:block!important;white-space:pre-wrap;font:13px/1.4 monospace;color:#000}}
</style></head><body>
<header><h1><span id="sn">Shop Manager Pro</span><span><small id="ol">online</small> <span class="dot" id="dot"></span></span></h1>
<div class="dn"><button data-a="prev" aria-label="Pichla din">◀</button><input type="date" id="dp" aria-label="Date"><button data-a="next" aria-label="Agla din">▶</button></div></header>
<main>
<section id="v-home">
<div id="bk" class="r hid"><b>Backup le lo.</b> <small>7 din se zyada ho gaye.</small> <button data-a="bak">Backup</button></div>
<input id="q" placeholder="Likho: Battery sell 180  (Enter = save)" autocomplete="off" enterkeyhint="done" aria-label="Quick entry">
<div id="pv" aria-live="polite"></div>
<div class="qr"><button class="p" data-a="qs">Save</button><button data-a="new">+ Detail</button><button data-a="rep">Aaj ka Hisaab</button></div>
<h2 id="dl"></h2><div class="g" id="dash"></div>
<div id="tk"></div><div id="un"></div>
<h2>Aaj ki entries</h2><div id="ls"></div>
</section>
<section id="v-khata" class="hid"><h2>Udhaar ledger (sab din)</h2><div id="kh"></div></section>
<section id="v-search" class="hid"><h2>Search</h2>
<div class="fm"><input id="sq" placeholder="Naam, note, category..." aria-label="Search">
<div class="f2"><select id="sk"><option value="">Sab type</option></select><select id="ss"><option value="">Sab shop</option><option>Shop 1</option><option>Shop 2</option></select></div>
<div class="f2"><input type="date" id="sa" aria-label="From"><input type="date" id="sb" aria-label="To"></div></div><div id="sr"></div></section>
<section id="v-set" class="hid"><h2>Settings</h2><div class="fm">
<label>Shop ka naam<input id="s_n"></label>
<label>Theme<select id="s_t"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_a" style="min-height:0"> Bina payment likhe sale = poora cash mila maano</label>
<button class="p" data-a="bak">Backup (JSON)</button><button data-a="csv">Sab entries CSV</button>
<button data-a="imp">Backup restore / merge</button><input type="file" id="fi" accept=".json" class="hid">
<p id="hl" class="mu"></p><button data-a="rst">Reset app data</button></div></section>
</main>
<nav><button data-a="v:home" class="on">Home</button><button data-a="v:khata">Udhaar</button><button data-a="v:search">Search</button><button data-a="v:set">Settings</button></nav>
<dialog id="ed"><div class="fm"><textarea id="f_raw" rows="2" placeholder="Description / note"></textarea>
<div class="f2"><label>Type<select id="f_kind"></select></label><label>Category<input id="f_cat"></label></div>
<div class="f2"><label>Total ₹<input id="f_amt" inputmode="decimal"></label><label>Baaki (udhaar) ₹<input id="f_out" inputmode="decimal"></label></div>
<div class="f2"><label>Mila ₹ (confirmed)<input id="f_paid" inputmode="decimal"></label><label>Method<select id="f_m"><option value="">—</option><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank">Bank</option><option value="other">Other</option></select></label></div>
<div class="f2"><button data-a="fp:cash">Poora mila: Cash</button><button data-a="fp:upi">Poora mila: UPI</button></div>
<div class="f2"><label>Customer<input id="f_c"></label><label>Shop<input id="f_s" list="shl"></label></div><datalist id="shl"><option>Shop 1</option><option>Shop 2</option></datalist>
<div class="f2"><label>Status<select id="f_st"><option value="ok">Confirmed</option><option value="unverified">Unverified</option><option value="cancelled">Cancelled</option></select></label><label>Task due<input type="date" id="f_due"></label></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f_done" style="min-height:0"> Task poora hua</label>
<small id="f_err" style="color:#d33"></small>
<div class="f2"><button class="p" data-a="fs">Save</button><button data-a="fx">Band</button></div>
<div class="f2"><button data-a="fd">Duplicate</button><button data-a="fk">Delete</button></div></div></dialog>
<dialog id="rd"><div class="fm"><label>Opening cash ₹ (optional)<input id="op" inputmode="decimal"></label><textarea id="rt" readonly></textarea>
<div class="f2"><button class="p" data-a="rc">Copy</button><button data-a="rs">Share</button><button data-a="rp">Print</button><button data-a="rv">Day CSV</button></div><button data-a="rx">Band</button></div></dialog>
<div id="pr"></div><div id="toast" class="hid"></div>
<script>
const $=s=>document.querySelector(s),KL={sale:'Sale',expense:'Kharcha',refund:'Refund',repay:'Udhaar jama',task:'Task',note:'Note'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=p=>'₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2}),fd=d=>d.split('-').reverse().join('/');
const sh=(d,n)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toLocaleDateString('en-CA')};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const P=v=>{v=String(v).trim();if(v==='')return null;const n=parseFloat(v);return isNaN(n)?NaN:Math.round(n*100)};
const A=new Map();let db,busy=0,cur=null,lim=50,S={date:'2026-10-28',shop:'Meri Dukaan',assume:0,theme:'',op:{},lb:0};
const kvg=k=>new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result&&q.result.v);q.onerror=()=>r()});
const kvs=(k,v)=>new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put({k,v});t.oncomplete=r;t.onerror=r});
const sv=()=>kvs('s',{...S});
const put=(r,act,b)=>new Promise((ok,no)=>{const t=db.transaction(['tx','log'],'readwrite');t.objectStore('tx').put(r);if(act)t.objectStore('log').put({id:uid(),tid:r.id,t:Date.now(),act,before:b||null});t.oncomplete=()=>{A.set(r.id,r);ok()};t.onerror=t.onabort=()=>no(t.error||new Error('write fail'))});
const del=x=>new Promise((ok,no)=>{const t=db.transaction(['tx','log'],'readwrite');t.objectStore('tx').delete(x.id);t.objectStore('log').put({id:uid(),tid:x.id,t:Date.now(),act:'delete',before:x});t.oncomplete=()=>{A.delete(x.id);ok()};t.onerror=t.onabort=()=>no(t.error||new Error('delete fail'))});
const bulk=r=>new Promise((ok,no)=>{const t=db.transaction('tx','readwrite');r.forEach(x=>t.objectStore('tx').put(x));t.oncomplete=()=>{r.forEach(x=>A.set(x.id,x));ok()};t.onerror=t.onabort=()=>no(t.error||new Error('bulk fail'))});
function toast(m,undo){const t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button>Undo</button>':'');t.classList.remove('hid');if(undo)t.querySelector('button').onclick=()=>{t.classList.add('hid');undo()};clearTimeout(toast.T);toast.T=setTimeout(()=>t.classList.add('hid'),undo?6000:2200)}
function parse(raw){
 const r={kind:'note',cat:'Note',amt:null,out:null,method:null,shop:null,status:'ok'};
 const s=raw.replace(/shop\s*([12])/i,(m,n)=>{r.shop='Shop '+n;return' '});
 if(/upi|gpay|phonepe|paytm/i.test(s))r.method='upi';else if(/\bcash\b/i.test(s))r.method='cash';
 const u=s.match(/(\d+)\s*(udhaar|udhar|baki|baaki|due)/i),rest=u?s.replace(u[0],' '):s;
 const n=[...rest.matchAll(/(?<![A-Za-z\d.\/])(\d+(?:\.\d+)?)(?![A-Za-z\d\/])(?!\s*(?:set|sets|pcs|pc|piece|nos|qty))/gi)].map(x=>+x[1]);
 if(n.length!==1)return r;
 const a=Math.round(n[0]*100),o=u?Math.round(u[1]*100):null;if(o!=null&&o>a)return r;
 r.amt=a;r.out=o;r.kind=/kharch|expense|chai|rent|nashta/i.test(s)?'expense':/refund/i.test(s)?'refund':'sale';
 if(/pending|\?|shayad|check/i.test(s))r.status='unverified';
 r.cat=/recharge/i.test(s)?'Recharge':/battery/i.test(s)?'Battery':/pin|charg|cable/i.test(s)?'Charging pin/parts':/cover|glass|guard/i.test(s)?'Accessories':/repair|setup|switch|not on|software/i.test(s)?'Mobile repair':'Other';
 return r}
const mk=p=>({id:uid(),date:S.date,created:Date.now(),raw:p.raw,kind:p.kind,cat:p.cat,amt:p.amt,out:p.out,paid:null,method:p.method,shop:p.shop,status:p.status,cust:'',hist:false,due:null,done:false});
function sum(L){const m={sales:0,unv:0,cash:0,upi:0,oth:0,cr:0,exp:0,ref:0,rep:0,unc:0,n:L.length,jobs:0};
 const add=(k,v)=>{if(k==='upi')m.upi+=v;else if(k==='cash')m.cash+=v;else m.oth+=v};
 for(const x of L){if(x.status==='cancelled')continue;
  if(x.kind==='sale'){if(x.status==='unverified'){m.unv+=x.amt;continue}
   m.sales+=x.amt;m.jobs++;m.cr+=x.out||0;let p=x.paid;if(p==null&&S.assume&&x.out==null)p=x.amt;
   if(p==null)m.unc+=x.amt-(x.out||0);else add(x.method||(S.assume?'cash':''),p)}
  else if(x.kind==='expense')m.exp+=x.amt;else if(x.kind==='refund')m.ref+=x.amt;
  else if(x.kind==='repay'){m.rep+=x.amt;add(x.method||'cash',x.amt)}}
 m.rec=m.cash+m.upi+m.oth;m.net=m.rec-m.exp-m.ref;return m}
function owed(){const o={};for(const x of A.values()){if(x.status==='cancelled'||x.status==='unverified')continue;
 if(x.kind==='sale'&&x.out){const k=x.cust||'Walk-in '+x.id.slice(-4);o[k]=(o[k]||0)+x.out}else if(x.kind==='repay'&&x.cust)o[x.cust]=(o[x.cust]||0)-x.amt}return o}
const day=()=>[...A.values()].filter(x=>x.date===S.date).sort((a,b)=>a.created-b.created);
function row(x,d){let t=(d?fd(x.date)+' • ':'')+KL[x.kind];if(x.amt!=null)t+=' '+R(x.amt);
 if(x.out)t+=' • udhaar '+R(x.out);if(x.kind==='sale'&&x.status==='ok'){t+=x.paid!=null?' • mila '+R(x.paid):(S.assume&&x.out==null?'':' • <i>payment confirm nahi</i>')}
 if(x.status==='unverified')t+=' • <i>UNVERIFIED</i>';if(x.hist)t+=' • <i>HISTORICAL</i>';if(x.cust)t+=' • '+esc(x.cust);if(x.shop)t+=' • '+esc(x.shop);
 return `<div class="r ${x.status}" data-a="edit" data-id="${x.id}"><div>${esc(x.raw)}</div><div class="bd">${t}</div></div>`}
function render(){
 th();$('#sn').textContent=S.shop;$('#dp').value=S.date;
 const L=day(),m=sum(L),C=(t,v,c)=>`<div class="c ${c||''}"><small>${t}</small><b>${v}</b></div>`;
 $('#dl').textContent=fd(S.date)+' ka hisaab'+(L.some(x=>x.hist)?' (HISTORICAL)':'');
 $('#dash').innerHTML=C('Confirmed sales',R(m.sales),'g1')+C('Cash mila',R(m.cash))+C('UPI mila',R(m.upi))+C('Other / method?',R(m.oth))+C('Udhaar bana',R(m.cr),'w')+C('Udhaar jama hua',R(m.rep))+C('Kharcha',R(m.exp))+C('Net cash movement',R(m.net),'g1')+C('Payment confirm nahi',R(m.unc),'w')+C('Unverified sale',R(m.unv),'w')+C('Jobs / entries',m.jobs+' / '+m.n)+C('Total udhaar (sab din)',R(Object.values(owed()).reduce((a,b)=>a+Math.max(b,0),0)),'w');
 const T=[...A.values()].filter(x=>x.kind==='task'&&!x.done&&x.status!=='cancelled'&&(x.due||x.date)<=S.date);
 $('#tk').innerHTML=T.length?'<h2>Pending tasks ('+T.length+')</h2>'+T.map(x=>row(x,1)).join(''):'';
 const U=L.filter(x=>x.status==='unverified'||(x.kind==='note'));
 $('#un').innerHTML=U.length?'<h2>Unverified / unclassified</h2>'+U.map(x=>row(x)).join(''):'';
 $('#ls').innerHTML=L.map(x=>row(x)).join('')||'<p class="mu">Abhi koi entry nahi. Upar likho: "Battery sell 180" aur Enter dabao.</p>';
 $('#bk').classList.toggle('hid',!(A.size&&Date.now()-S.lb>6048e5));
 const o=owed();$('#kh').innerHTML=Object.entries(o).filter(e=>e[1]!==0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="r"><b>${esc(k)}</b> — baaki ${R(v)} <button data-a="repay" data-c="${esc(k)}">Jama</button></div>`).join('')||'<p class="mu">Koi udhaar baaki nahi.</p>';
 if(!$('#v-search').classList.contains('hid'))srch()}
function srch(){const q=$('#sq').value.toLowerCase(),k=$('#sk').value,s=$('#ss').value,a=$('#sa').value,b=$('#sb').value;
 const r=[...A.values()].filter(x=>(!q||(x.raw+' '+x.cust+' '+x.cat).toLowerCase().includes(q))&&(!k||x.kind===k)&&(!s||x.shop===s)&&(!a||x.date>=a)&&(!b||x.date<=b)).sort((x,y)=>y.date.localeCompare(x.date)||y.created-x.created);
 $('#sr').innerHTML=(r.slice(0,lim).map(x=>row(x,1)).join('')+(r.length>lim?'<button data-a="more">Aur dikhao ('+(r.length-lim)+')</button>':''))||'<p class="mu">Kuch nahi mila.</p>'}
const th=()=>document.documentElement.dataset.t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const q=$('#q');
q.oninput=()=>{localStorage.d=q.value;const v=q.value.trim();if(!v){$('#pv').textContent='';return}const p=parse(v);
 $('#pv').textContent=p.amt!=null?`${KL[p.kind]} ${R(p.amt)}${p.out!=null?' • udhaar '+R(p.out):''} • ${p.cat}${p.status==='unverified'?' • UNVERIFIED':''}`:'Note ke roop mein save hoga (amount clear nahi)'};
q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();qs()}};
async function qs(){const v=q.value.trim();if(!v||busy)return;busy=1;try{const p=parse(v);p.raw=v;await put(mk(p),'add');q.value='';localStorage.d='';$('#pv').textContent='Saved ✓';render()}catch(e){toast('SAVE NAHI HUA: '+e.message)}busy=0;q.focus()}
function setv(v){for(const s of['home','khata','search','set'])$('#v-'+s).classList.toggle('hid',s!==v);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.a==='v:'+v));
 if(v==='set'){$('#s_n').value=S.shop;$('#s_t').value=S.theme;$('#s_a').checked=!!S.assume;health()}render()}
async function health(){let t=A.size+' entries';try{const e=await navigator.storage.estimate(),p=await navigator.storage.persisted();t+=' • '+(e.usage/1024).toFixed(0)+' KB use • storage '+(p?'persistent':'persistent nahi (backup zaroor lo)')}catch{}
 $('#hl').textContent=t+' • Last backup: '+(S.lb?new Date(S.lb).toLocaleDateString('en-IN'):'kabhi nahi')}
function openEd(x){cur=x;const n=!x;x=x||{raw:'',kind:'sale',cat:'',amt:null,out:null,paid:null,method:'',cust:'',shop:'',status:'ok',due:'',done:false};
 $('#f_raw').value=x.raw;$('#f_kind').value=x.kind;$('#f_cat').value=x.cat||'';
 for(const[k,f]of[['amt','amt'],['out','out'],['paid','paid']])$('#f_'+f).value=x[k]==null?'':x[k]/100;
 $('#f_m').value=x.method||'';$('#f_c').value=x.cust||'';$('#f_s').value=x.shop||'';$('#f_st').value=x.status;$('#f_due').value=x.due||'';$('#f_done').checked=!!x.done;$('#f_err').textContent='';
 document.querySelectorAll('[data-a=fk],[data-a=fd]').forEach(b=>b.classList.toggle('hid',n));$('#ed').showModal()}
async function fs(){if(busy)return;const K=$('#f_kind').value,a=P($('#f_amt').value),o=P($('#f_out').value),p=P($('#f_paid').value),raw=$('#f_raw').value.trim();
 const e=!raw?'Description likho':[a,o,p].some(Number.isNaN)?'Amount galat hai':(K!=='note'&&K!=='task'&&a==null)?'Total amount likho':(o!=null&&a!=null&&o>a)?'Baaki total se zyada nahi ho sakta':'';
 if(e){$('#f_err').textContent=e;return}busy=1;
 const b=cur,r=Object.assign(b?{...b}:mk({raw,kind:K,cat:'',amt:null,out:null,method:null,shop:null,status:'ok'}),{raw,kind:K,cat:$('#f_cat').value.trim()||KL[K],amt:a,out:o,paid:p,method:$('#f_m').value||null,cust:$('#f_c').value.trim(),shop:$('#f_s').value.trim()||null,status:$('#f_st').value,due:$('#f_due').value||null,done:$('#f_done').checked});
 try{await put(r,b?'edit':'add',b);$('#ed').close();toast('Saved ✓');render()}catch(x){$('#f_err').textContent='SAVE NAHI HUA: '+x.message}busy=0}
async function fk(){if(!cur||!confirm('Ye entry delete karein?'))return;const x=cur;try{await del(x);$('#ed').close();render();toast('Delete ho gaya',async()=>{try{await put(x,'undo-delete');render()}catch(e){toast('Undo fail: '+e.message)}})}catch(e){toast('Delete fail: '+e.message)}}
async function fd2(){if(!cur)return;const r={...cur,id:uid(),created:Date.now(),hist:false};try{await put(r,'duplicate');$('#ed').close();render();toast('Duplicate ban gaya')}catch(e){toast('Fail: '+e.message)}}
async function repay(c){const v=prompt(c+' ne kitna diya? (e.g. 500 ya 500 upi)');if(!v)return;const n=v.match(/\d+(\.\d+)?/);if(!n)return toast('Amount samajh nahi aaya');
 const a=Math.round(n[0]*100),ow=owed()[c]||0;if(a>ow&&!confirm('Baaki sirf '+R(ow)+' hai. Phir bhi save?'))return;
